<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#185FA5"/>
      <stop offset="100%" stop-color="#7c6cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Venn motif -->
  <g transform="translate(905,315)" opacity="0.92">
    <circle cx="0" cy="-70" r="120" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="62" cy="40" r="120" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="-62" cy="40" r="120" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="-46" y="-12" width="92" height="46" rx="23" fill="#DC2626"/>
    <text x="0" y="19" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="700">別解</text>
  </g>

  <!-- Copy -->
  <text x="90" y="180" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="700" opacity="0.85">bekkai</text>
  <text x="86" y="300" fill="#ffffff" font-family="sans-serif" font-size="72" font-weight="800">自己分析で、</text>
  <text x="86" y="392" fill="#ffffff" font-family="sans-serif" font-size="72" font-weight="800">終わらせない。</text>
  <text x="90" y="470" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="500" opacity="0.92">あなただけの「別解」を、実現するまで。</text>
  <text x="90" y="540" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="500" opacity="0.7">発見 → 別解 → 実現 ＋ 失敗で立て直す　|　無料・登録なし</text>
</svg>
