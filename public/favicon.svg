<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 5つの力カラー（別解→実現→失敗→成長→発見）でレインボー -->
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="26%" stop-color="#EA580C"/>
      <stop offset="52%" stop-color="#0D9488"/>
      <stop offset="76%" stop-color="#185FA5"/>
      <stop offset="100%" stop-color="#7c6cff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#ffffff"/>

  <g fill="none" stroke="url(#rainbow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="184" r="118"/>
    <circle cx="182" cy="318" r="118"/>
    <circle cx="330" cy="318" r="118"/>
  </g>
</svg>
